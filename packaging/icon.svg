<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- sage tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#7E9079"/>
  <!-- clock face ring -->
  <circle cx="128" cy="132" r="74" fill="none" stroke="#F2F1EC" stroke-width="20"/>
  <!-- hands -->
  <g stroke="#3E3A33" stroke-width="14" stroke-linecap="round">
    <line x1="128" y1="132" x2="128" y2="74"/>
    <line x1="128" y1="132" x2="170" y2="108"/>
  </g>
  <!-- center pin -->
  <circle cx="128" cy="132" r="11" fill="#3E3A33"/>
</svg>
